# Publishes the repository root (a single static index.html) to GitHub Pages.
#
# configure-pages runs with enablement: true, so the first successful run turns
# Pages on by itself — no manual step in repo settings.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/code-prompts-page-4gb2vv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
