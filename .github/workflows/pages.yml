# Publishes the repository root (a single static index.html) to GitHub Pages.
#
# Pages must be enabled once by hand: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions". The workflow cannot do this itself — creating a
# Pages site needs repo admin rights, which the built-in GITHUB_TOKEN does not
# have (configure-pages with enablement: true fails "Resource not accessible by
# integration"). After that one click, every push deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/code-prompts-page-4gb2vv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
