# Publishes the repository root (a single static index.html) to GitHub Pages.
#
# Manual trigger only. Pages must be enabled first — Settings -> Pages ->
# Source: "GitHub Actions" — which for a private repo needs GitHub Enterprise
# Cloud, or the repo made public. Until then this workflow would fail on every
# push, so it does not run on push by design. Add a `push:` trigger once Pages
# is on and the first manual run is green.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
